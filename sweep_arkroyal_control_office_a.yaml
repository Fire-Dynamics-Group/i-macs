# MACS+ sweep — Ark Royal (Winvic), Control Office A
# Base inputs imported from "Control Office A.frc" (project 0395).
# Two levers swept to straddle the pass/fail boundary for verdict testing:
#   - time_limit : ISO fire resistance period (min)  -> fire severity
#   - mesh_type  : slab reinforcement (A393 -> A142)  -> membrane capacity
# 3 x 4 = 12 runs. (A393, 60 min) is the robust corner; (A142, 120 min) the
# clear-fail corner. See expected results printed alongside this file.

analysis_method: "iso"          # .frc Method=2

sweep:
  time_limit: [60, 90, 120]     # ISO fire rating period, minutes
  mesh_type: ["A393", "A252", "A193", "A142"]

fixed:
  # --- Geometry (GA) ---
  numbeam: 2
  span1: 8.225
  span2: 8.5
  # --- Deck ---
  deck_id: "T8"                 # Multideck 60
  # --- Slab ---
  conc_type: "NW"
  conc_lambda: 1
  fck: 25
  slab_depth: 140
  mesh_axis: 40
  mesh_strength: 500
  # --- Internal (unprotected) secondary beam ---
  u_sec_size: "UB_457x152x52"
  u_sec_fy: "355"
  u_sec_sh_con: 80
  # --- Loading ---
  slab_weight: 2.59
  cold_perm: 1.2
  lead_var_act: 5
  othr_var_act: 0
  lead_var_fac: 0.5
  othr_var_fac: 0.3
  # --- Fire compartment (carried from .frc; inert under ISO) ---
  Lc: 27
  Bc: 18
  Hc: 3.6
  Hw: 1.8
  Lw: 30

# Perimeter (protected) beams — from .frc Beams block
beams:
  side_a:
    sec_size: "UB_457x152x52"
    fy: 355
    edge: true
    composite: true
    sh_con: 80
  side_b:
    sec_size: "UB_533x210x82"
    fy: 355
    edge: false
    composite: true
    sh_con: 80
  side_c:
    sec_size: "UB_406x140x39"
    fy: 355
    edge: true
    composite: true
    sh_con: 80
  side_d:
    sec_size: "UB_457x152x52"
    fy: 355
    edge: true
    composite: true
    sh_con: 80

