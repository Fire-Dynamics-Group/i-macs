# VERIFIED RESULTS — ran 2026-05-19 through the real FRACOF engine (12/12 OK).
# Verdict = corrected compute_status (issue #34): UF < 1.001 AND every
# perimeter-beam load ratio <= 1.0.  Beam ratios stay 0.15-0.40 throughout,
# so UF governs every verdict here.
#
#   time  mesh   UF_max  comp_failure   verdict
#     60  A393    0.674       1         PASS   <- comp_failure=1 but PASSES
#     90  A393    0.687       1         PASS   <- comp_failure=1 but PASSES
#    120  A393    0.693       0         PASS
#     60  A252    0.744       0         PASS
#     90  A252    0.807       0         PASS
#    120  A252    1.002       0         FAIL   <- razor-edge: 0.001 over limit
#     60  A193    0.906       0         PASS
#     90  A193    0.993       0         PASS   <- razor-edge pass
#    120  A193    1.237       0         FAIL
#     60  A142    1.119       0         FAIL
#     90  A142    1.245       0         FAIL
#    120  A142    1.556       0         FAIL
#
#   => 7 PASS / 5 FAIL
#
# The two A393 rows have comp_failure=1: on the OLD code they show FAIL (the
# spurious composite gate); on the issue-34-uf-verdict branch they show PASS.
# So this sweep also regression-tests the #34 fix directly.
# ---------------------------------------------------------------------------
