[package]
name = "i-macs"
version = "0.1.0-rc.13"
description = "Tauri shell for the MACS+ Automation desktop app."
authors = ["Fire Dynamics Group"]
license = ""
edition = "2021"
rust-version = "1.70"
default-run = "i-macs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# rusqlite (bundled) is used to read the `settings` table from results.db at
# startup so we can inject MACS_DATA_PATH when spawning the sidecar (#23).
# `bundled` ships SQLite with the binary — no system dependency on user machines.
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
