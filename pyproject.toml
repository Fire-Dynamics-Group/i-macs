[project]
name = "macs-automation"
version = "0.1.0"
description = "MACS+ Batch Automation Tool — parameter sweep runner for FRACOF fire engineering"
requires-python = ">=3.10"
dependencies = [
    # 32-bit-Python-3.10-compatible runtime deps for the sidecar bundle.
    # scipy/matplotlib/python-docx are NOT here — scipy has no 32-bit win
    # wheels, the others are only needed for deferred-PR features (LHS,
    # report). Test/dev installs use requirements.txt instead.
    "pywin32>=306",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macs_automation*"]
exclude = ["macs_automation.tests*", "venv*", "docs*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pypdf>=4.0",
    # Sweep / LHS / report features — 64-bit dev env only (no 32-bit wheels).
    "scipy>=1.10",
    "matplotlib>=3.8",
    "python-docx>=1.0",
]

[tool.pytest.ini_options]
markers = [
    "com: tests that require the FRACOF COM engine (32-bit Python + MACS+ installed)",
    "e2e: end-to-end tests; with COM available run real calculations, otherwise skip with reason",
]
