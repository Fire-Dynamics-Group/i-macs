{% extends "base.html" %}
{% block title %}MACS+ — Live Dashboard{% endblock %}

{% block content %}
<h2>Live Dashboard</h2>

<!-- Progress bar -->
<article id="progress-card">
    <header>
        <span id="status-label">Waiting for data...</span>
        <button type="button" id="stop-batch-btn" class="secondary" style="display:none;">Stop</button>
    </header>
    <progress id="progress-bar" value="0" max="100"></progress>
    <div class="grid">
        <div><strong>Completed:</strong> <span id="completed">0</span> / <span id="total">0</span></div>
        <div><strong>Errors:</strong> <span id="errors" class="fail">0</span></div>
        <div><strong>Elapsed:</strong> <span id="elapsed">—</span></div>
    </div>
</article>

<!-- Charts in 2x2 grid -->
<div class="grid">
    <article>
        <div id="chart-scatter" class="chart-container"></div>
    </article>
    <article>
        <div id="chart-capacity" class="chart-container"></div>
    </article>
</div>
<div class="grid">
    <article>
        <div id="chart-beam-temp" class="chart-container"></div>
    </article>
    <article>
        <div id="chart-mesh-temp" class="chart-container"></div>
    </article>
</div>

<!-- Summary shown on batch complete -->
<article id="batch-summary" style="display:none;">
    <header>Batch Complete</header>
    <p id="summary-text"></p>
    <div class="grid">
        <a id="download-docx-btn" href="/api/report/docx" role="button">Download Report (DOCX)</a>
        <a href="/api/report" role="button" class="secondary">Download Report ZIP</a>
    </div>
</article>
{% endblock %}

{% block scripts %}
<script src="/static/dashboard.js"></script>
{% endblock %}
