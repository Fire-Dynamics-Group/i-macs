# Fully pinned dependency set for the frozen 32-bit sidecar + PyInstaller.
#
# This is what the release workflow installs — NOT requirements-sidecar.txt,
# which states intent and constraints. Releases must not float: rc.13 froze
# uvicorn/fastapi/starlette versions no dev or test environment had ever run,
# and that drift was half of its boot crash.
#
# Every pin here must have a win32 cp310 wheel (the runner cannot compile x86
# C extensions). To regenerate after deliberately changing
# requirements-sidecar.txt:
#
#   py -3.10-32 -m venv %TEMP%\venv-ci32   (short path — MAX_PATH)
#   %TEMP%\venv-ci32\Scripts\pip install --only-binary=:all: -r requirements-sidecar.txt pyinstaller
#   %TEMP%\venv-ci32\Scripts\pip freeze --exclude-editable > requirements-sidecar.lock
#   (then restore this header comment and run the local release mirror script)
#
# Locked 2026-07-30 from the resolve that built and shipped v0.1.0-rc.14.
# 2026-11-12: added msal==1.39.0 and the packages it imports (requests,
# PyJWT, cryptography, cffi, pycparser, certifi, charset-normalizer,
# urllib3). Those versions are what
# `pip download --only-binary=:all: --platform win32 --python-version 310
# --implementation cp --abi cp310 msal==1.39.0` selected. cryptography
# 48.0.1 is the newest release that still publishes a win32 wheel under
# msal's cryptography<51 bound. The earlier pins were not refloated.
