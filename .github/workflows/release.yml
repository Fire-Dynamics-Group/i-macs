name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up 32-bit Python 3.10
        # x86 architecture is mandatory: FRACOF COM is 32-bit only, so the
        # PyInstaller bundle must be built with a 32-bit interpreter.
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: "x86"

      - name: Verify Python is 32-bit
        shell: pwsh
        run: |
          $bits = python -c "import struct; print(struct.calcsize('P')*8)"
          if ($bits -ne '32') {
              Write-Error "Python is $bits-bit; needed 32-bit. setup-python's architecture: x86 didn't take."
              exit 1
          }

      - name: Install sidecar Python deps
        # requirements-sidecar.txt excludes scipy/matplotlib/python-docx —
        # none of those have 32-bit Windows wheels for cp310, and they're
        # only consumed by features deferred to follow-up PRs (LHS, report).
        run: |
          python -m venv venv-32
          venv-32\Scripts\python -m pip install --upgrade pip
          venv-32\Scripts\pip install -r requirements-sidecar.txt -e . pyinstaller

      - name: Build sidecar (PyInstaller)
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install npm deps
        run: npm install

      - name: Build, sign, and publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MACS+ Automation ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install. Already-installed copies will auto-update on next launch."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
