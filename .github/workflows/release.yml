name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tests:
    # A tag must pass the full CI suite before anything is built or
    # published — rc.11 and rc.12 shipped while main's pytest job was red,
    # because tag pushes never triggered CI.
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.10
        # x86 architecture is mandatory: FRACOF COM is 32-bit only, so the
        # PyInstaller bundle must be built with a 32-bit interpreter.
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x86"

      - name: Verify Python is 32-bit
        shell: pwsh
        run: |
          $bits = python -c "import struct; print(struct.calcsize('P')*8)"
          if ($bits -ne '32') {
              Write-Error "Python is $bits-bit; needed 32-bit. setup-python's architecture: x86 didn't take."
              exit 1
          }

      - name: Install sidecar Python deps
        # matplotlib and python-docx ARE included: the report and chart-export
        # endpoints need them, and a build without them answers
        # {"detail": "No module named 'matplotlib'"} to every chart or report
        # download while working perfectly in dev. numpy is capped below 2.0
        # here — see requirements-sidecar.txt for why that is forced.
        #
        # scipy remains excluded because no 32-bit cp310 wheel exists at all,
        # so LHS sampling cannot run in a packaged build. Grid/paired sweeps
        # are unaffected.
        #
        # --only-binary=:all: because this runner cannot link x86 C
        # extensions (rc.13's first run died compiling kiwisolver): a dep
        # that stops shipping win32 wheels must fail at resolve time, not
        # as a linker error mid-build. The local package itself is a source
        # install, so it goes in a separate --no-deps step.
        run: |
          python -m venv venv-32
          venv-32\Scripts\python -m pip install --upgrade pip
          venv-32\Scripts\pip install --only-binary=:all: -r requirements-sidecar.txt pyinstaller
          venv-32\Scripts\pip install --no-deps -e .

      - name: Build sidecar (PyInstaller)
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Verify the sidecar bundle can actually render
        # A release once shipped a sidecar with no matplotlib in it. Nothing
        # failed at build time — the modules are imported lazily inside the
        # endpoint handlers, so the omission only surfaced as a 500 on a user's
        # machine. Check the bundle, then boot it and confirm it answers.
        shell: pwsh
        run: |
          $bundle = "src-tauri/binaries/i-macs-sidecar-x86_64-pc-windows-msvc"
          foreach ($pkg in 'matplotlib', 'numpy', 'docx') {
              if (-not (Test-Path "$bundle/_internal/$pkg")) {
                  Write-Error "$pkg is missing from the frozen bundle — charts and reports would 500 at runtime."
                  exit 1
              }
              Write-Host "  ok  $pkg present"
          }

          # Longest path in the bundle + a generous install-prefix budget must
          # clear MAX_PATH (260): the app installs per-user under a path like
          # C:\Users\<name>\AppData\Local\MACS+ Automation\binaries\<triple>\,
          # and a dep that starts shipping deeper trees would otherwise only
          # fail on a user's machine at install time.
          $prefixBudget = 130
          $longest = Get-ChildItem -Recurse -File $bundle |
              ForEach-Object { $_.FullName.Substring((Resolve-Path $bundle).Path.Length + 1) } |
              Sort-Object Length -Descending | Select-Object -First 1
          if ($prefixBudget + $longest.Length -gt 260) {
              Write-Error "Bundle path too deep for MAX_PATH: '$longest' is $($longest.Length) chars; with a $prefixBudget-char install prefix that exceeds 260."
              exit 1
          }
          Write-Host "  ok  longest bundle path is $($longest.Length) chars (budget $(260 - $prefixBudget))"

          $exe = Resolve-Path "$bundle/i-macs-sidecar.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList '--port', '8199' -PassThru `
              -RedirectStandardOutput sidecar-stdout.log -RedirectStandardError sidecar-stderr.log
          try {
              $alive = $false
              foreach ($attempt in 1..90) {
                  Start-Sleep -Seconds 1
                  try {
                      $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8199/healthz' -TimeoutSec 2
                      if ($r.sidecar -eq 'alive') { $alive = $true; break }
                  } catch { }
                  if ($proc.HasExited) { break }
              }
              if (-not $alive) {
                  Write-Host "process exited: $($proc.HasExited) (code $($proc.ExitCode))"
                  Write-Host '== sidecar stdout =='
                  Get-Content sidecar-stdout.log -ErrorAction SilentlyContinue
                  Write-Host '== sidecar stderr =='
                  Get-Content sidecar-stderr.log -ErrorAction SilentlyContinue
                  Write-Error "Frozen sidecar did not answer /healthz — the bundle is broken."
                  exit 1
              }
              Write-Host "  ok  frozen sidecar booted and answered /healthz"
          } finally {
              if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm deps
        run: npm install

      - name: Build, sign, and publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MACS+ Automation ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install. Already-installed copies will auto-update on next launch."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
